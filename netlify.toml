[build]
  publish = "."

# Pretty URLs: /booking → /booking/index.html, no trailing slash needed
[build.processing]
  pretty_urls = true

# Forms are enabled by default when a <form netlify> is detected.
# Amy gets email notifications via Netlify site settings → Forms → Notifications.

# Client intake form retired 2026-06-20 (security: stop collecting passport/payment
# PII by email). Page (clientintake.html) and endpoint (submit-intake) removed;
# redirect the old URL to home so shared links don't dead-end.
[[redirects]]
  from = "/clientintake"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/clientintake.html"
  to = "/"
  status = 301
  force = true
